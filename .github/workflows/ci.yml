name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  # Every pull request, whatever its base branch. This used to be limited to PRs
  # into main/develop, so a PR STACKED on a feature branch ran no gate at all:
  # tests, both sweeps, the security audit and the Docker build were silently
  # skipped while the PR showed only green Vercel checks. (#315, stacked on
  # feat/ui-ux-overhaul, would have merged an image that could not build.) A
  # stacked PR is exactly where a regression should be caught — before it lands
  # in the branch it is stacked on.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      # Retried once: `canvas` downloads a prebuilt binary from GitHub releases
      # during install, and when that download blips it falls back to a source
      # build the runner cannot do (no cairo headers). That failed #315's security
      # job on a run where every other job installed fine. A genuine dependency or
      # lockfile error fails both attempts.
      run: |
        npm ci || { echo "::warning::npm ci failed; retrying once"; sleep 15; npm ci; }
        cd client && { npm ci || { echo "::warning::client npm ci failed; retrying once"; sleep 15; npm ci; }; }

    - name: Generate Prisma Client
      run: npm run prisma:generate

    - name: Run linter
      run: npm run lint

    - name: Typecheck client
      run: npm run typecheck

    - name: Test client
      # Client jest (jsdom RTL + util suites). Gated: it runs no network/DB, so it
      # must stay green. (Previously only `tsc` ran here, letting two util suites
      # rot unnoticed — see PR #218.)
      run: cd client && npm test -- --ci --watchAll=false

    - name: Run unit tests
      # Collects coverage as it runs (merged and threshold-checked in "Check
      # coverage" below) instead of re-running every suite a second time just
      # to measure it. Retried once, only on a V8 crash (133 inspector
      # assertion nodejs/node#58460, 134 abort/heap) — never on a test failure.
      run: |
        set +e
        run() { npm run test:unit -- --coverage --coverageDirectory=coverage/unit --coverageReporters=json --coverageThreshold='{}' "$@"; }
        run
        code=$?
        if [ "$code" -eq 133 ] || [ "$code" -eq 134 ]; then
          echo "::warning::Unit run killed by a V8 crash (exit $code), not a test result. Retrying once against a fresh database."
          MONGODB_URI=mongodb://localhost:27017/click-test-retry run
          code=$?
        fi
        exit $code
      env:
        NODE_ENV: test
        NODE_OPTIONS: --max-old-space-size=6144
        MONGODB_URI: mongodb://localhost:27017/click-test
        JWT_SECRET: test-secret-key
        REDIS_URL: redis://localhost:6379

    - name: Run integration tests
      # GATING. Run SERIALLY (--runInBand): integration suites are I/O-bound and a
      # couple (server-startup spawns real processes on dynamic ports) flake under
      # parallel workers from port/resource contention + cross-file mongoose
      # connection cycling. Serial is slower but reliable and sidesteps the old
      # race entirely. Also fixed: stale subscription/verify assertion, scheduler
      # spinning its own MongoMemoryServer (404s on the runner), and spawned prod
      # servers now get a test OAUTH_ENCRYPTION_KEY so they boot.
      # Also collects coverage (see "Run unit tests").
      run: |
        set +e
        run() { npm run test:integration -- --runInBand --coverage --coverageDirectory=coverage/integration --coverageReporters=json --coverageThreshold='{}' "$@"; }
        run
        code=$?
        if [ "$code" -eq 133 ] || [ "$code" -eq 134 ]; then
          echo "::warning::Integration run killed by a V8 crash (exit $code), not a test result. Retrying once against a fresh database."
          MONGODB_URI=mongodb://localhost:27017/click-test-int-retry run
          code=$?
        fi
        exit $code
      env:
        NODE_ENV: test
        NODE_OPTIONS: --max-old-space-size=6144
        MONGODB_URI: mongodb://localhost:27017/click-test
        JWT_SECRET: test-secret-key
        REDIS_URL: redis://localhost:6379

    - name: Check coverage
      # GATING ratchet: merges the coverage the two test steps collected and
      # enforces jest.config.js coverageThreshold on the merged numbers.
      # This used to be a THIRD full run of every unit + integration suite,
      # serially in one process, only to measure coverage — 75 to 190 minutes,
      # and long enough that GitHub lost contact with the runner and failed
      # the job (#330). Fails if either step produced no coverage.
      run: node scripts/coverage-merge-check.js coverage/unit coverage/integration

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info
        fail_ci_if_error: false

  # Breadth sweeps over every mounted endpoint. These are the two checks that
  # actually catch a route regressing to a 5xx or leaking across tenants, and
  # they were manual-only until now (see docs/readiness/endpoint-coverage.md).
  # Both are hermetic and self-isolating — writeSweep.js forces an in-memory
  # Mongo and blanks REDIS_URL/SUPABASE_URL itself, and smokeFull boots the app
  # in-process — so they need no service containers and no secrets. Kept in
  # their own job so a sweep failure is legible at a glance instead of being
  # buried at the end of the long `test` job.
  sweeps:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Both sweeps need a database. This job used to declare none, so
    # tests/setup.js fell through to its documented fallback — MongoMemoryServer
    # cannot download its binary on the runner, so it tried
    # mongodb://localhost:27017 and got ECONNREFUSED. Every query then buffered
    # until the 60s bufferTimeoutMS fired, which surfaced as a hook timeout and
    # failed the job on runs where the sweep itself reported ZERO server errors.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      # Retried once — see the note on the `test` job's install step.
      run: npm ci || { echo "::warning::npm ci failed; retrying once"; sleep 15; npm ci; }

    - name: Generate Prisma Client
      run: npm run prisma:generate

    # Walks every mounted GET endpoint. Fails if SERVER_ERROR exceeds the
    # ratchet in tests/smoke/smokeFull.test.js (MAX_SERVER_ERRORS = 0) — any new
    # GET 5xx is a regression.
    - name: GET breadth sweep
      run: npm run smoke:full
      env:
        NODE_ENV: test
        JWT_SECRET: test-secret-key
        MONGODB_URI: mongodb://localhost:27017/click-test-sweeps

    # Walks every mounted POST/PUT/PATCH/DELETE as user A, then replays each
    # successful write on an owned resource as user B. Exit 1 on any 5xx, any
    # cross-tenant write (IDOR), or any 2xx carrying success:false.
    - name: WRITE breadth sweep (incl. cross-tenant IDOR)
      run: npm run smoke:writes
      env:
        NODE_ENV: test
        JWT_SECRET: test-secret-key
        MONGODB_URI: mongodb://localhost:27017/click-test-sweeps

    - name: Upload sweep reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: endpoint-sweep-reports
        path: tests/reports/
        if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      # Retried once: `canvas` downloads a prebuilt binary from GitHub releases
      # during install, and when that download blips it falls back to a source
      # build the runner cannot do (no cairo headers). That failed #315's security
      # job on a run where every other job installed fine. A genuine dependency or
      # lockfile error fails both attempts.
      run: |
        npm ci || { echo "::warning::npm ci failed; retrying once"; sleep 15; npm ci; }
        cd client && { npm ci || { echo "::warning::client npm ci failed; retrying once"; sleep 15; npm ci; }; }

    - name: Generate Prisma Client
      run: npm run prisma:generate

    - name: Build frontend
      run: npm run build
      env:
        NODE_ENV: production

    - name: Build Docker image
      run: docker build -t click:latest .

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # test:security boots the app + hits the DB; without a mongo service every
    # security suite failed with ECONNREFUSED (the job set a localhost MONGODB_URI
    # but provided no server). Mirror the `test` job's services. Redis stays
    # optional (caching degrades gracefully) but is provided for parity.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      # Retried once — see the note on the `test` job's install step.
      run: npm ci || { echo "::warning::npm ci failed; retrying once"; sleep 15; npm ci; }

    - name: Generate Prisma Client
      run: npm run prisma:generate

    # Fail if a real .env or key material was ever committed (the highest-leverage
    # leak guardrail — local pre-commit hooks can be skipped, CI can't).
    - name: Scan for committed secrets
      run: node scripts/check-secrets.js

    # Runtime deps are clean at high/critical (all prior highs fixed via direct
    # bumps + overrides — see docs/security-debt.md). Gate at high so no new
    # high/critical advisory can merge unnoticed. The 4 remaining moderates need
    # major bumps and are documented/accepted in docs/security-debt.md.
    - name: Run security audit
      run: npm audit --omit=dev --audit-level=high

    - name: Run security tests
      run: npm run test:security
      env:
        NODE_ENV: test
        JWT_SECRET: test-secret-key-for-ci-only-not-used-in-prod
        MONGODB_URI: mongodb://localhost:27017/click-test
        REDIS_URL: redis://localhost:6379
